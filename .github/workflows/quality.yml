name: Documentation quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: tools/diagrams/package-lock.json

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements/docs.txt

      - name: Install Python development dependencies
        run: python -m pip install --requirement requirements/dev.txt

      - name: Check Python formatting
        run: python -m ruff format --check src tests

      - name: Lint Python
        run: python -m ruff check src tests

      - name: Type-check Python
        run: python -m mypy

      - name: Test Python
        run: python -m pytest

      - name: Install diagram dependencies
        run: npm ci --prefix tools/diagrams

      - name: Render and verify Mermaid diagrams
        shell: sh
        run: |
          set -eu
          rendered_dir=$(mktemp -d)
          trap 'rm -rf "$rendered_dir"' EXIT HUP INT TERM
          ./scripts/render-diagrams.sh --output-dir "$rendered_dir"
          ./scripts/check-rendered-diagrams.sh --rendered-dir "$rendered_dir"

      - name: Build documentation strictly
        run: python -m mkdocs build --strict --clean

      - name: Check Markdown links
        run: scripts/check-markdown-links.sh

      - name: Check repository hygiene
        run: scripts/check-repository-hygiene.sh
