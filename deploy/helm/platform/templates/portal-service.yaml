apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-portal
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "platform.portalSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.portal.service.port }}
      targetPort: http
      protocol: TCP
