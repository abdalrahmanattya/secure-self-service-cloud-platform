nameOverride: ""
fullnameOverride: ""

mode: simulation

api:
  replicaCount: 2
  image:
    repository: ghcr.io/example-org/secure-cloud-platform-api
    tag: "1.0.0-rc.1"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    annotations: {}

portal:
  replicaCount: 2
  image:
    repository: ghcr.io/example-org/secure-cloud-platform-portal
    tag: "1.0.0-rc.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  serviceAccount:
    annotations: {}

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx

# Deliberately no Secret or ExternalSecret is rendered by this chart.
# Provider-native workload identity and an operator-reviewed External Secrets
# template can be supplied by a deployment overlay.
