site_name: Secure Self-Service Cloud Platform
site_description: Provider-selectable self-service Kubernetes environment platform for AWS or Azure
site_url: https://abdalrahmanattya.github.io/secure-self-service-cloud-platform/
repo_url: https://github.com/abdalrahmanattya/secure-self-service-cloud-platform
repo_name: abdalrahmanattya/secure-self-service-cloud-platform

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Simulation quickstart: simulation-quickstart.md
  - Product overview: product-overview.md
  - Administrator deployment guide: administrator-deployment-guide.md
  - Architecture tour: architecture-tour.md
  - Proposal lifecycle: proposal-lifecycle.md
  - Architecture: architecture.md
  - Domain model and contracts: domain-model.md
  - Shared interfaces: interfaces.md
  - Provider selection: provider-selection.md
  - Providers:
      - Overview: providers/README.md
      - AWS simulation: providers/aws.md
      - AWS sandbox and enterprise: providers/aws-deployment.md
      - Azure simulation: providers/azure.md
      - Azure sandbox and enterprise: providers/azure-deployment.md
  - References:
      - Overview: reference/README.md
      - API: reference/api.md
      - CLI: reference/cli.md
      - Portal: reference/portal.md
      - Terraform modules: terraform-modules.md
      - Runtime containers and Helm: runtime-delivery.md
      - Policy: policy-reference.md
      - Authentication and OIDC: authentication-oidc.md
      - State model: state-model.md
      - Security and threat model: security-threat-model.md
      - Cost model: cost-model.md
      - Provider comparison: provider-comparison.md
  - Operations:
      - Overview: operations/README.md
      - Protected deployment: operations/deployment.md
      - Drift: operations/drift.md
      - Rollback: operations/rollback.md
      - Destroy and expiry: operations/destroy.md
      - Incident response: operations/incidents.md
      - Troubleshooting: operations/troubleshooting.md
  - Diagrams: diagrams/README.md
  - Decisions:
      - Overview: decisions/README.md
      - One provider per installation: decisions/ADR-001-one-provider-per-installation.md
      - Provider-neutral domain and adapter ports: decisions/ADR-002-provider-neutral-domain-and-adapter-ports.md
      - Credential-free provider simulations: decisions/ADR-003-credential-free-provider-simulations.md
      - One service for every interface: decisions/ADR-004-one-service-for-api-cli-and-portal.md
      - Deterministic proposal bundles: decisions/ADR-005-deterministic-proposal-bundles.md
      - GitHub-only protected deployment: decisions/ADR-006-github-only-protected-deployment.md
  - Simulation demonstration: simulation-demonstration.md
  - Retrospective: retrospective.md
  - v1.0.0 release record: release-candidate-checklist.md
  - Glossary: glossary.md

strict: true
